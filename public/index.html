<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alice in Wonderland</title>
    <!-- a playing-card heart on cream; app.js swaps in a gold pip when something waits -->
    <link
      id="favicon"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fffdf8'/%3E%3Cpath d='M16 26S5 19 5 12.5A5.5 5.5 0 0 1 16 10a5.5 5.5 0 0 1 11 2.5C27 19 16 26 16 26z' fill='%23c4384a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img
          id="portrait"
          src="/characters/front.png"
          alt="Alice"
          width="52"
          height="52"
        />
        <div>
          <h1 id="title">Alice in Wonderland</h1>
          <p id="tagline"></p>
        </div>
      </div>
      <button id="new-btn" class="primary">Shall we begin?</button>
    </header>

    <dialog id="new-dialog">
      <form method="dialog" id="new-form">
        <button type="button" id="new-dismiss" class="dismiss" aria-label="Close">&times;</button>
        <h2>Shall we begin?</h2>
        <label>
          <span id="new-name-label"></span>
          <input name="sessionName" placeholder="raid-migration" autocomplete="off" />
        </label>
        <label>
          <span id="new-model-label"></span>
          <select name="sessionModel" id="new-model"></select>
        </label>
        <label>
          <span id="new-where-label"></span>
          <input name="cwd" required placeholder="/Users/kunhwi.ko/Documents/projects/…" />
        </label>
        <label>
          <span id="new-what-label"></span>
          <textarea name="prompt" required rows="4" placeholder="Have a look at the failing test…"></textarea>
        </label>
        <menu>
          <!-- formnovalidate: without it the required fields block the close -->
          <button value="cancel" type="submit" class="ghost" formnovalidate>Never mind</button>
          <button value="go" type="submit" class="primary" id="new-go"></button>
        </menu>
      </form>
    </dialog>

    <main>
      <section id="queue"></section>
      <details id="archive-wrap">
        <summary id="archive-summary"></summary>
        <section id="archive"></section>
      </details>
    </main>

    <footer id="footer"></footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
