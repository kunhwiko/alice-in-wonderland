<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alice in Wonderland</title>
    <!-- a playing-card heart on cream; app.js swaps in a gold ring when something waits -->
    <link
      id="favicon"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fffdf8'/%3E%3Cpath d='M16 26S5 19 5 12.5A5.5 5.5 0 0 1 16 10a5.5 5.5 0 0 1 11 2.5C27 19 16 26 16 26z' fill='%23c4384a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <!-- three.js comes out of node_modules (see VENDOR in server/index.js) -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Wonderland itself. Labels and Alice's speech bubble float over it. -->
    <canvas id="world" aria-label="Wonderland"></canvas>
    <div id="overlay" aria-hidden="true"></div>
    <div id="no-world" hidden></div>

    <header id="hud">
      <div class="brand">
        <h1 id="title">Alice in Wonderland</h1>
        <p id="tagline"></p>
      </div>
      <!-- The same two places the world has, for keyboards and for when
           there's no WebGL to draw them with. -->
      <nav class="places">
        <button id="go-tea" class="place place-tea"><span class="place-name"></span><span class="place-count"></span></button>
        <button id="go-court" class="place place-court"><span class="place-name"></span><span class="place-count"></span></button>
        <button id="go-hall" class="place place-hall"><span class="place-name"></span><span class="place-count"></span></button>
        <button id="new-btn" class="primary">Shall we begin?</button>
      </nav>
    </header>

    <aside id="panel" hidden>
      <!-- drag to resize; app.js remembers the width -->
      <div id="panel-grip" role="separator" aria-orientation="vertical"></div>
      <div class="panel-head">
        <div>
          <h2 id="panel-title"></h2>
          <p id="panel-hint"></p>
        </div>
        <button id="panel-expand" class="dismiss"></button>
        <button id="panel-close" class="dismiss" aria-label="Close">&times;</button>
      </div>
      <div class="panel-body">
        <section id="tea" class="panel-view" hidden>
          <div id="tea-status"></div>
          <div id="tea-list"></div>
        </section>
        <section id="court" class="panel-view" hidden>
          <!-- Alice's desk: everything waiting on you, answerable in place -->
          <section id="desk" hidden></section>
          <section id="queue"></section>
          <details>
            <summary id="archive-summary"></summary>
            <section id="archive"></section>
          </details>
        </section>
        <section id="hall" class="panel-view" hidden>
          <div id="hall-status"></div>
          <section id="hall-doors"></section>
          <section id="hall-bottles"></section>
        </section>
      </div>
      <footer id="footer"></footer>
    </aside>

    <dialog id="new-dialog">
      <form method="dialog" id="new-form">
        <button type="button" id="new-dismiss" class="dismiss" aria-label="Close">&times;</button>
        <h2>Shall we begin?</h2>
        <label>
          <span id="new-name-label"></span>
          <input name="sessionName" autocomplete="off" />
        </label>
        <label>
          <span id="new-model-label"></span>
          <select name="sessionModel" id="new-model"></select>
        </label>
        <label>
          <span id="new-where-label"></span>
          <input name="cwd" required placeholder="/Users/kunhwi.ko/Documents/projects/…" />
        </label>
        <label>
          <span id="new-what-label"></span>
          <textarea name="prompt" required rows="4" placeholder="Have a look at the failing test…"></textarea>
        </label>
        <menu>
          <!-- formnovalidate: without it the required fields block the close -->
          <button value="cancel" type="submit" class="ghost" formnovalidate>Never mind</button>
          <button value="go" type="submit" class="primary" id="new-go"></button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
